<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitLife - Life Simulator</title>
    <style>
        /* 1. Reset Base & Center the Frame */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Myriad Pro", Myriad, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* 2. Create a tight, rigid portrait crop box */
        .webgl-content {
            background: #231F20;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. HARDCODE FIXED DIMENSIONS (Forces Unity to render everything closely together) */
        #gameContainer {
            position: absolute;
            width: 450px !important;   /* Locks the narrow compact width */
            height: 800px !important;  /* Locks the compact height to pull stats UP */
            top: 50%;
            left: 50%;
            z-index: 2;
            
            /* DYNAMIC HARDWARE ZOOM: Calculates how small your phone is, centers, and scales perfectly */
            transform: translate(-50%, -50%) scale(calc(100vh / 820));
            transform-origin: center center;
        }

        canvas {
            position: absolute;
            width: 100% !important;
            height: 100% !important;
            top: 0;
            left: 0;
            object-fit: contain !important;
        }

        /* Loader & Progress styling adjustments to match the fixed frame */
        .progress, .webgl-content .logo {
            position: absolute;
            left: 50%;
            top: 45%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        .webgl-content .logo {
            background: url(logo.png) no-repeat center/contain;
            width: 130px;
            height: 130px;
        }
        .webgl-content .progress {
            height: 18px;
            width: 141px;
            margin-top: 90px;
        }
        .webgl-content .progress .empty {
            background: url(TemplateData/progressEmpty.Light.png) no-repeat right/cover;
            float: right;
            width: 100%;
            height: 100%;
            display: inline-block;
        }
        .webgl-content .progress .full {
            background: url(TemplateData/progressFull.Light.png) no-repeat left/cover;
            float: left;
            width: 0%;
            height: 100%;
            display: inline-block;
        }
    </style>
    <link rel="canonical" href="/">
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script>
      var unityInstance = UnityLoader.instantiate("gameContainer", "https://jsdelivr.net", {onProgress: UnityProgress});
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
  </body>
</html>
