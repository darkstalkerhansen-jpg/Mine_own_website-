<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>BitLife - Life Simulator</title>
    <style>
        /* 1. Global Reset & Center Alignment */
        body, html {
            margin: 0 auto;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Myriad Pro", Myriad, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* 2. Portrait View Framework (Collapses the large middle empty gap) */
        .webgl-content {
            background: #231F20;
            width: 100vw;
            height: 100vh;
            max-width: 56.25vh; /* Locks layout ratio strictly to mobile 9:16 portrait standards */
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Overwrite hardcoded internal full-width selectors injected by Unity */
        #errorBrowserBlock, #loadingBlock, .webgl-content * {
            max-width: 100%;
            box-sizing: border-box;
        }

        /* 3. Force canvas matrix to scale uniformly within the wrapper bounds */
        #gameContainer {
            position: absolute;
            width: 100% !important;
            height: 100% !important;
            top: 0;
            left: 0;
            z-index: 2;
        }

        canvas {
            position: absolute;
            width: 100% !important;
            height: 100% !important;
            top: 0;
            left: 0;
            object-fit: contain !important; /* Forces uniform compression on portrait view grids */
        }

        /* Loader & Progress bar elements */
        .progress, .webgl-content .logo {
            position: absolute;
            left: 50%;
            top: 45%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        .webgl-content .logo {
            background: url(logo.png) no-repeat center/contain;
            width: 130px;
            height: 130px;
        }
        .webgl-content .progress {
            height: 18px;
            width: 141px;
            margin-top: 90px;
        }
        .webgl-content .progress .empty {
            background: url(TemplateData/progressEmpty.Light.png) no-repeat right/cover;
            float: right;
            width: 100%;
            height: 100%;
            display: inline-block;
        }
        .webgl-content .progress .full {
            background: url(TemplateData/progressFull.Light.png) no-repeat left/cover;
            float: left;
            width: 0%;
            height: 100%;
            display: inline-block;
        }
        .webgl-content .logo.Dark { background-image: url(logo.png); }
        .webgl-content .progress.Dark .empty { background-image: url(TemplateData/progressEmpty.Dark.png); }
        .webgl-content .progress.Dark .full { background-image: url(TemplateData/progressFull.Dark.png); }
    </style>
    <link rel="canonical" href="/">
    <script src="https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/bitlife/TemplateData/UnityProgress.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/bitlife/Build/UnityLoader.js"></script>
    <script>
      var unityInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/bitlife/Build/BitLife.json", {onProgress: UnityProgress});
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
  </body>
</html>
