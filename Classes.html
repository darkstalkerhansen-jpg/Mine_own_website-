<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classes</title>
    <style>
        /* 1. Remove default browser padding and scrollbars from the main page */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* 2. Force the iframe to lock to all four edges of the screen */
        .fullscreen-iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Ensures it sits on top of any other elements */
        }
    </style>
</head>
<body>

    
    
    <!-- Button to trigger the JavaScript function -->
    

    <!-- Embedded iframe with an initial source URL -->
    <iframe 
        id="myIframe"
        src="https://example.com"
        class="fullscreen-iframe">
    </iframe>

    <!-- Script section to handle page logic -->
    <script>
        function changeSource(page) {
            // Get the iframe element by its ID
            const iframe = document.getElementByClass('fullscreen-iframe');
            
            // Change the source URL of the iframe
            iframe.src = page;
            
        }
        window.addEventListener('DOMContentLoaded', () => {
            // Parse the URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const targetPage = urlParams.get('page');

            // If the 'page' parameter exists, run your function
            if (targetPage) {
                changeSource(targetPage);
            }
        });
        window.addEventListener('keydown', (event) => {
  // Check if the pressed key is 'l' or 'L'
  if (event.key === 'l' || event.key === 'L') {
    window.location.href = 'index.html';
  }
});

    </script>

</body>
</html>
