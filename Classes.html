<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <h1>HTML Iframe and Script Demo</h1>
    
    <!-- Button to trigger the JavaScript function -->
    <button onclick="changeSource()">Change Iframe Source</button>

    <!-- Embedded iframe with an initial source URL -->
    <iframe 
        id="myIframe" 
        src="https://example.com" 
        title="Sample Embedded Page" 
        width="600" 
        height="400" 
        style="border: 2px solid #333;">
    </iframe >

    <!-- Script section to handle page logic -->
    <script>
        function changeSource(page) {
            // Get the iframe element by its ID
            const iframe = document.getElementById('myIframe');
            
            // Change the source URL of the iframe
            iframe.src = page;
            
        }
        window.addEventListener('DOMContentLoaded', () => {
            // Parse the URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const targetPage = urlParams.get('page');

            // If the 'page' parameter exists, run your function
            if (targetPage) {
                changeSource(targetPage);
            }
        });
    </script>

</body>
</html>
