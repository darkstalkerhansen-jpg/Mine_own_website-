<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classes</title>
    <style>
        /* 1. Remove default browser padding and scrollbars from the main page */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 80%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* 2. Force the iframe to lock to all four edges of the screen */
        .fullscreen-iframe {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            width: 100%;
            height: 80%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }

        /* 3. Small exit button pinned to the top-right corner */
        .exit-button {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999; /* Ensures it stays on top of the iframe */
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            font-family: sans-serif;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
            opacity: 0.5;
        }

        .exit-button:hover {
            background-color: rgba(255, 0, 0, 0.8); /* Turns red on hover */
        }
    </style>
</head>
<body>

    <!-- Embedded iframe with an initial source URL -->
    <iframe id="myIframe" src="https://example.com" class="fullscreen-iframe"></iframe>

    <!-- Fixed Exit Button -->
    <a href="index.html" class="exit-button">✕ Exit</a>

    <!-- Script section to handle page logic -->
    <script>
        function changeSource(page) {
            const iframe = document.getElementById('myIframe');
            iframe.src = page;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetPage = urlParams.get('page');
            if (targetPage) {
                changeSource(targetPage);
            }
        });
        window.alert("1");
    </script>
</body>
</html>
