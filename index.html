<body>

    <label>
        <input type="checkbox" id="myCheckbox"> Optimization?
    </label>

    <!-- Base URLs kept clean so JavaScript can safely append the query parameter -->
    <p><a class="game-link" href="Classes.html?page=Games/Escaperoad.html">Escape road</a></p>
    <p><a class="game-link" href="Classes.html?page=Games/Bitlife.html">Bitlife</a></p>
    <p><a class="game-link" href="Classes.html?page=Games/Amongus.html">amogus?</a></p>
    <p><a class="game-link" href="Classes.html?page=Games/FNAF.html">FNAF</a></p>
    <p><a class="game-link" href="Classes.html?page=Games/Minecraft.html">minecraft</a></p>
    <p><a class="game-link" href="Classes.html?page=Games/MelonPLY.html">melon playground</a></p>
    <p><a class="game-link" href="Classes.html?page=Games/Solarsmash.html">solar smash</a></p>
    <p><a class="game-link" href="Classes.html?page=Games/Ragdollarchers.html">ragdoll archer</a></p>

    <br><br><br><br><br>
    <h3>VERSION 1.0</h3>
    <br><br><br><br><br>

    <script>
        const checkbox = document.getElementById('myCheckbox');
        const gameLinks = document.querySelectorAll('.game-link');

        // Add a click listener to all game links
        gameLinks.forEach(link => {
            link.addEventListener('click', (event) => {
                // Stop the browser from navigating immediately
                event.preventDefault(); 
                
                // Read the current state of the checkbox
                const optimized = checkbox.checked; 
                
                // Get the base href and append the dynamic optimize value
                const baseHref = link.getAttribute('href');
                const finalUrl = `${baseHref}&optimize=${optimized}`;
                
                // Navigate to the built URL
                window.location.href = finalUrl;
            });
        });
    </script>
</body>
</html>
