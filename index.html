.grain { position: relative; isolation: isolate; }

  inset: 0;
  z-index: 1;
  opacity: 0;
  mix-blend-mode: overlay;
  background-image:

}

    <script>
        const checkbox = document.getElementById('myCheckbox');
        const gameLinks = document.querySelectorAll('.grain');

        // Add a click listener to all game links
        gameLinks.forEach(link => {
            link.addEventListener('click', (event) => {
                // Stop the browser from navigating immediately
                event.preventDefault(); 
                
                // Read the current state of the checkbox
                const optimized = checkbox.checked; 
                
                // Get the base href and append the dynamic optimize value
                const baseHref = link.getAttribute('href');
                const finalUrl = `${baseHref}&optimize=${optimized}`;
                
                // Navigate to the built URL
                window.location.href = finalUrl;
            });
        });
    </script>
